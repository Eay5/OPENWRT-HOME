name: Build 6.18 ImmortalWrt HONK

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: SSH connection to Actions
        required: false
        default: "false"
      runner:
        description: Runner label, for example ubuntu-24.04 or self-hosted
        required: false
        default: "ubuntu-24.04"
  schedule:
    - cron: "50 18 * * *" # 北京时间 每天凌晨 02:50 (UTC 18:50)
    - cron: "50 0 * * *"  # 北京时间 每天上午 08:50 (UTC 00:50)
    - cron: "50 4 * * *"  # 北京时间 每天中午 12:50 (UTC 04:50)
    - cron: "50 6 * * *"  # 北京时间 每天下午 14:50 (UTC 06:50)
    - cron: "50 9 * * *"  # 北京时间 每天下午 17:50 (UTC 09:50)

jobs:
  build:
    uses: ./.github/workflows/reusable-openwrt-build.yml
    secrets: inherit
    with:
      runner: ${{ github.event.inputs.runner || 'ubuntu-24.04' }}
      enable_ssh: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.ssh == 'true') || github.event.action == 'ssh' }}
      config_file: 6.18-honk.config
      diy_p1_sh: 6.18-honk-part1.sh
      diy_p2_sh: 6.18-honk-part2.sh
      kernel_series: "6.18"
      firmware_artifact_prefix: ImmortalWrt-6.18-HONK
      bin_artifact_prefix: ImmortalWrt_bin-HONK
      release_tag_prefix: "HONK-"
      release_title_template: "⚡ ImmortalWrt {{kernel}} [HONK · eBPF性能版] - {{date_short}}"
      extra_feed_packages: honk luci-app-honk smartdns luci-app-smartdns
      config_sync_mode: honk
      repo_branch: master
