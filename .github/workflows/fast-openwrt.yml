name: Fast ImmortalWrt Build (Release Toolchain Cache)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Select target version to build"
        required: true
        default: "6.18"
        type: choice
        options:
          - "6.18"
          - "6.18-physical"
      rebuild_toolchain:
        description: "Force rebuild and update Toolchain cache in Release"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      ssh:
        description: "SSH connection to Actions"
        required: false
        default: "false"

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  TZ: Asia/Shanghai
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
  CCACHE_MAXSIZE: 3G
  RELEASE_TOOLCHAIN_TAG: toolchain-cache-immortalwrt
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  fast_build:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Setup build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt update
          sudo -E apt -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            llvm python3-pyelftools libpython3-dev ccache zstd \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev \
            autoconf automake libtool cmake ninja-build meson python3-pip gh
          sudo ln -sf /usr/share/zoneinfo/${TZ} /etc/localtime
          echo "${TZ}" | sudo tee /etc/timezone

      - name: Resolve target files
        id: target
        run: |
          ver="${{ github.event.inputs.version }}"
          echo "Building target version: ${ver}"
          if [ "${ver}" = "6.18-physical" ]; then
            echo "config_file=6.18-physical.config" >> "$GITHUB_OUTPUT"
            echo "p1_sh=6.18-part1.sh" >> "$GITHUB_OUTPUT"
            echo "p2_sh=6.18-physical-part2.sh" >> "$GITHUB_OUTPUT"
            echo "kernel_series=6.18" >> "$GITHUB_OUTPUT"
          else
            echo "config_file=6.18.config" >> "$GITHUB_OUTPUT"
            echo "p1_sh=6.18-part1.sh" >> "$GITHUB_OUTPUT"
            echo "p2_sh=6.18-part2.sh" >> "$GITHUB_OUTPUT"
            echo "kernel_series=6.18" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone OpenWrt source
        run: |
          git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt

      - name: Restore download & CCache (safe size under 10G limit)
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
            ~/.cache/go-build
          key: fast-openwrt-safe-cache-${{ steps.target.outputs.kernel_series }}-${{ hashFiles('**/feeds.conf.default', steps.target.outputs.config_file) }}
          restore-keys: |
            fast-openwrt-safe-cache-${{ steps.target.outputs.kernel_series }}-
            fast-openwrt-safe-cache-

      - name: Configure CCache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size="${CCACHE_MAXSIZE}" || true
          ccache --set-config=compression=true || true

      - name: Load custom feeds & install
        run: |
          chmod +x "${{ steps.target.outputs.p1_sh }}"
          cd openwrt
          "$GITHUB_WORKSPACE/${{ steps.target.outputs.p1_sh }}"
          ./scripts/feeds install -a -f

      - name: Load custom config & sync
        run: |
          [ -e files ] && cp -r files openwrt/files
          [ -e physical-files ] && cp -r physical-files openwrt/physical-files
          cp "${{ steps.target.outputs.config_file }}" openwrt/.config
          chmod +x "${{ steps.target.outputs.p2_sh }}"
          cd openwrt
          "$GITHUB_WORKSPACE/${{ steps.target.outputs.p2_sh }}"
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig

      - name: Restore prebuilt toolchain from GitHub Release
        id: restore_toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCHIVE_NAME="toolchain-${{ steps.target.outputs.kernel_series }}.tar.zst"
          REBUILD="${{ github.event.inputs.rebuild_toolchain }}"
          
          if [ "$REBUILD" != "true" ]; then
            echo "Checking Release tag '${RELEASE_TOOLCHAIN_TAG}' for prebuilt $ARCHIVE_NAME..."
            if gh release download "$RELEASE_TOOLCHAIN_TAG" -p "$ARCHIVE_NAME" --dir /tmp 2>/dev/null; then
              echo "Toolchain archive found in release! Extracting..."
              cd openwrt
              tar -I zstd -xf "/tmp/$ARCHIVE_NAME"
              rm -f "/tmp/$ARCHIVE_NAME"
              
              echo "Fixing file timestamps to prevent GNU Make rebuild..."
              # 关键：更新解压出产物的时间戳，防止 Makefile 判定过期
              find staging_dir build_dir -exec touch {} + 2>/dev/null || true
              echo "toolchain_hit=true" >> "$GITHUB_OUTPUT"
            else
              echo "Toolchain archive not found in Release. Will build from source and publish."
              echo "toolchain_hit=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Force rebuild requested. Skipping download."
            echo "toolchain_hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build tools and toolchain
        run: |
          cd openwrt
          echo "Building / verifying tools..."
          make tools/install -j"$(nproc)" || make tools/install -j1
          echo "Building / verifying toolchain..."
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1

      - name: Package & Publish Toolchain to Release (if rebuilt or missing)
        if: steps.restore_toolchain.outputs.toolchain_hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCHIVE_NAME="toolchain-${{ steps.target.outputs.kernel_series }}.tar.zst"
          echo "Packaging toolchain for future builds..."
          cd openwrt
          tar -I 'zstd -3 -T0' -cf "/tmp/$ARCHIVE_NAME" staging_dir build_dir/host build_dir/toolchain-*
          
          echo "Publishing to Release tag '${RELEASE_TOOLCHAIN_TAG}'..."
          gh release view "$RELEASE_TOOLCHAIN_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TOOLCHAIN_TAG" --title "Prebuilt ImmortalWrt Toolchains" --notes "Cached toolchain tarballs for fast ImmortalWrt builds"
          
          gh release upload "$RELEASE_TOOLCHAIN_TAG" "/tmp/$ARCHIVE_NAME" --clobber
          rm -f "/tmp/$ARCHIVE_NAME"

      - name: Download packages
        run: |
          cd openwrt
          make download -j8 || true

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(( $(nproc) + 1 )) || make -j1 V=s
          ccache -s || true

      - name: Organize files
        run: |
          cd openwrt
          mkdir -p bin/firmware
          find bin/targets/ -type f \( -name "*sysupgrade*" -o -name "*combined*" -o -name "*.img*" -o -name "*.bin" \) -exec cp {} bin/firmware/ \;
          echo "FIRMWARE_DIR=$PWD/bin/firmware" >> "$GITHUB_ENV"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fast-ImmortalWrt-${{ github.event.inputs.version }}
          path: ${{ env.FIRMWARE_DIR }}/*
