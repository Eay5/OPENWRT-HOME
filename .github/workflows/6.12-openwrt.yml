name: Build 6.12 ImmortalWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: SSH connection to Actions
        required: false
        default: "false"
      runner:
        description: Runner label, for example ubuntu-24.04 or self-hosted
        required: false
        default: "ubuntu-24.04"
  schedule:
    - cron: "30 18 * * *" # 北京时间 每天凌晨 02:30 (UTC 18:30)
    - cron: "30 0 * * *"  # 北京时间 每天上午 08:30 (UTC 00:30)
    - cron: "30 4 * * *"  # 北京时间 每天中午 12:30 (UTC 04:30)
    - cron: "30 6 * * *"  # 北京时间 每天下午 14:30 (UTC 06:30)
    - cron: "30 9 * * *"  # 北京时间 每天下午 17:30 (UTC 09:30)
  watch:
    types:
      - started

jobs:
  build:
    uses: ./.github/workflows/reusable-openwrt-build.yml
    secrets: inherit
    with:
      runner: ${{ github.event.inputs.runner || 'ubuntu-24.04' }}
      enable_ssh: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.ssh == 'true') || github.event.action == 'ssh' }}
      config_file: 6.12.config
      diy_p1_sh: 6.12-part1.sh
      diy_p2_sh: 6.12-part2.sh
      kernel_series: "6.12"
      firmware_artifact_prefix: ImmortalWrt-6.12
      bin_artifact_prefix: ImmortalWrt_bin
      release_title_template: ImmortalWrt Linux-{{kernel}} X86-64 Build {{build_time}}
      extra_feed_packages: pcre2 luci-app-homeproxy sing-box smartdns luci-app-smartdns
      config_sync_mode: homeproxy
      repo_branch: openwrt-25.12
