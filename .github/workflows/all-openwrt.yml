name: Build All OpenWrt Variants

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: SSH connection to Actions
        required: false
        default: "false"
      runner:
        description: Optional runner override, for example self-hosted
        required: false
        default: ""

env:
  TZ: Asia/Shanghai

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger build workflows
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_INPUT: ${{ github.event.inputs.ssh }}
          RUNNER_INPUT: ${{ github.event.inputs.runner }}
        run: |
          workflows=(
            "6.18-openwrt.yml"
            "6.18-physical-openwrt.yml"
            "5.10.lucky-openwrt.yml"
            "5.4-openwrt.yml"
          )

          runner_args=()
          if [ -n "${RUNNER_INPUT}" ]; then
            runner_args=(-f runner="${RUNNER_INPUT}")
          fi

          for workflow in "${workflows[@]}"; do
            echo "Triggering ${workflow}"

            if [ "${SSH_INPUT}" = "true" ]; then
              gh workflow run "${workflow}" --repo "${GITHUB_REPOSITORY}" "${runner_args[@]}" -f ssh=true
            else
              gh workflow run "${workflow}" --repo "${GITHUB_REPOSITORY}" "${runner_args[@]}"
            fi
          done

      - name: Print summary
        run: |
          echo "Triggered workflows:"
          echo "  - 6.18-openwrt.yml"
          echo "  - 6.18-physical-openwrt.yml"
          echo "  - 5.10.lucky-openwrt.yml"
          echo "  - 5.4-openwrt.yml"
