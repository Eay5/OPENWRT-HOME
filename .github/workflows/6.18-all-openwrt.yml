name: Build All 6.18 ImmortalWrt (多版本并发编译)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      build_times:
        description: "选择编译次数 (例如 1 次、2 次、3 次...)"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"
        default: "1"
      custom_name:
        description: "自定义固件名称/备注 (可选，例如: test1、dev、v2，留空则自动按日期时间命名)"
        required: false
        type: string
        default: ""
      build_homeproxy:
        description: "编译 HomeProxy 常规版"
        required: true
        type: boolean
        default: true
      build_honk:
        description: "编译 HONK (eBPF) 版"
        required: true
        type: boolean
        default: true
      build_lucky:
        description: "编译 LUCKY 版"
        required: true
        type: boolean
        default: true
      build_physical:
        description: "编译 物理机 (Intel/RTL 2.5G) 版"
        required: true
        type: boolean
        default: true
      runner:
        description: "Runner 标签"
        required: false
        default: "ubuntu-24.04"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Generate build matrix iterations
        id: gen
        run: |
          count="${{ inputs.build_times || '1' }}"
          list=$(seq 1 "$count" | jq -s -c .)
          echo "matrix=$list" >> "$GITHUB_OUTPUT"
          echo "生成的编译轮次序列: $list"

  build-homeproxy:
    needs: setup
    if: ${{ inputs.build_homeproxy == true || inputs.build_homeproxy == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        iteration: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/reusable-openwrt-build.yml
    secrets: inherit
    with:
      runner: ${{ inputs.runner || 'ubuntu-24.04' }}
      config_file: 6.18.config
      diy_p1_sh: 6.18-part1.sh
      diy_p2_sh: 6.18-part2.sh
      kernel_series: "6.18"
      firmware_artifact_prefix: ImmortalWrt-6.18-HomeProxy
      bin_artifact_prefix: ImmortalWrt_bin-HomeProxy
      release_tag_prefix: "HomeProxy-"
      release_title_template: "🛡️ ImmortalWrt {{kernel}} [HomeProxy · 科学代理版] - {{date_short}}"
      custom_firmware_tag: ${{ inputs.custom_name || '' }}
      extra_feed_packages: pcre2 luci-app-homeproxy sing-box smartdns luci-app-smartdns sing-geoip sing-geosite
      config_sync_mode: homeproxy
      repo_branch: master

  build-honk:
    needs: setup
    if: ${{ inputs.build_honk == true || inputs.build_honk == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        iteration: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/reusable-openwrt-build.yml
    secrets: inherit
    with:
      runner: ${{ inputs.runner || 'ubuntu-24.04' }}
      config_file: 6.18-honk.config
      diy_p1_sh: 6.18-honk-part1.sh
      diy_p2_sh: 6.18-honk-part2.sh
      kernel_series: "6.18"
      firmware_artifact_prefix: ImmortalWrt-6.18-HONK
      bin_artifact_prefix: ImmortalWrt_bin-HONK
      release_tag_prefix: "HONK-"
      release_title_template: "⚡ ImmortalWrt {{kernel}} [HONK · eBPF性能版] - {{date_short}}"
      custom_firmware_tag: ${{ inputs.custom_name || '' }}
      extra_feed_packages: honk luci-app-honk smartdns luci-app-smartdns
      config_sync_mode: honk
      repo_branch: master

  build-lucky:
    needs: setup
    if: ${{ inputs.build_lucky == true || inputs.build_lucky == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        iteration: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/reusable-openwrt-build.yml
    secrets: inherit
    with:
      runner: ${{ inputs.runner || 'ubuntu-24.04' }}
      config_file: 6.18-lucky.config
      diy_p1_sh: 6.18-lucky-part1.sh
      diy_p2_sh: 6.18-lucky-part2.sh
      kernel_series: "6.18"
      firmware_artifact_prefix: ImmortalWrt-6.18-LUCKY
      bin_artifact_prefix: ImmortalWrt_bin-LUCKY
      release_tag_prefix: "LUCKY-"
      release_title_template: "🌐 ImmortalWrt {{kernel}} [LUCKY · 内网穿透版] - {{date_short}}"
      custom_firmware_tag: ${{ inputs.custom_name || '' }}
      extra_feed_packages: lucky luci-app-lucky
      config_sync_mode: lucky
      repo_branch: master

  build-physical:
    needs: setup
    if: ${{ inputs.build_physical == true || inputs.build_physical == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        iteration: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/reusable-openwrt-build.yml
    secrets: inherit
    with:
      runner: ${{ inputs.runner || 'ubuntu-24.04' }}
      config_file: 6.18-physical.config
      diy_p1_sh: 6.18-part1.sh
      diy_p2_sh: 6.18-physical-part2.sh
      kernel_series: "6.18"
      firmware_artifact_prefix: ImmortalWrt-6.18-Physical-2.5G
      bin_artifact_prefix: ImmortalWrt_bin-Physical
      release_tag_prefix: "Physical-"
      release_title_template: "🚀 ImmortalWrt {{kernel}} [物理机 · Intel/RTL 2.5G版] - {{date_short}}"
      custom_firmware_tag: ${{ inputs.custom_name || '' }}
      extra_feed_packages: pcre2 luci-app-homeproxy sing-box smartdns luci-app-smartdns sing-geoip sing-geosite
      config_sync_mode: homeproxy
      repo_branch: master
