name: Build 6.18 ImmortalWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: SSH connection to Actions
        required: false
        default: "false"
      runner:
        description: Runner label, for example ubuntu-24.04 or self-hosted
        required: false
        default: "ubuntu-24.04"
  schedule:
    - cron: "15 18 * * *" # 北京时间 每天凌晨 02:15 (UTC 18:15)
    - cron: "15 0 * * *"  # 北京时间 每天上午 08:15 (UTC 00:15)
    - cron: "15 4 * * *"  # 北京时间 每天中午 12:15 (UTC 04:15)
    - cron: "15 6 * * *"  # 北京时间 每天下午 14:15 (UTC 06:15)
    - cron: "15 9 * * *"  # 北京时间 每天下午 17:15 (UTC 09:15)
  watch:
    types:
      - started

jobs:
  build:
    uses: ./.github/workflows/reusable-openwrt-build.yml
    secrets: inherit
    with:
      runner: ${{ github.event.inputs.runner || 'ubuntu-24.04' }}
      enable_ssh: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.ssh == 'true') || github.event.action == 'ssh' }}
      config_file: 6.18.config
      diy_p1_sh: 6.18-part1.sh
      diy_p2_sh: 6.18-part2.sh
      kernel_series: "6.18"
      firmware_artifact_prefix: ImmortalWrt-6.18
      bin_artifact_prefix: ImmortalWrt_bin
      release_title_template: ImmortalWrt Linux-{{kernel}} X86-64 Build {{build_time}}
      extra_feed_packages: pcre2 luci-app-homeproxy sing-box smartdns luci-app-smartdns
      config_sync_mode: homeproxy
